<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bid Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>418 Bid Calculator</h1>
      <!-- row 1 -->
      <div class="load">
        <!--Load 1-->
        <label
          >Equipment 1
          <select class="loadEquipment">
            <option value="13.48">Utility Trailer (13.48 cubic yards)</option>
            <option value="2.7">Pickup Truck (2.7 cubic yards)</option>
          </select>
        </label>
        <label
          >How Full?
          <select class="loadFullness">
            <option value="1">Completely Full (1)</option>
            <option value="0.75">Three-Quarters Full (0.75)</option>
            <option value="0.5">Half Full(0.5)</option>
            <option value="0.25">Quarter Full (0.25)</option>
          </select>
        </label>

        <label>
          Material Type
          <select class="materialType">
            <option value="yardDebris">Yard Debris</option>
            <option value="householdJunk">Household Junk</option>
            <option value="furniture">Furniture</option>
            <option value="constructionDebris">Construction Debris</option>
            <option value="heavyDebris">
              Heavy Debris (concrete/brick/dirt)
            </option>
          </select>
        </label>
        <!--TODO add numberOfLoadsInputErrorMsg-->
        <label
          >Number of Loads
          <input class="loadCount" type="number" min="0" value="0" step="1" />
        </label>
      </div>

      <!-- row 2 -->
      <div class="load">
        <label
          >Equipment 2
          <select class="loadEquipment">
            <option value="2.7">Pickup Truck (2.7 cubic yards)</option>
            <option value="13.48">Utility Trailer (13.48 cubic yards)</option>
          </select>
        </label>
        <label
          >How Full?
          <select class="loadFullness">
            <option value="1">Completely Full (1)</option>
            <option value="0.75">Three-Quarters Full (0.75)</option>
            <option value="0.5">Half Full(0.5)</option>
            <option value="0.25">Quarter Full (0.25)</option>
          </select>
        </label>
        <label>
          Material Type
          <select class="materialType">
            <option value="yardDebris">Yard Debris</option>
            <option value="householdJunk">Household Junk</option>
            <option value="furniture">Furniture</option>
            <option value="constructionDebris">Construction Debris</option>
            <option value="heavyDebris">
              Heavy Debris (concrete/brick/dirt)
            </option>
          </select>
        </label>
        <!--TODO add numberOfLoadsInputErrorMsg-->
        <label
          >Number of Loads
          <input class="loadCount" type="number" min="0" value="0" step="1" />
        </label>
      </div>
      <!-- <div class="jobType">
        <label>Type of Job</label>
        <select>
          <option value="15">Yard Debris</option>
          <option value="25"></option>
        </select>
      </div> -->
      <div class="field">
        <label for="dumpWeight">Override weight (tons, optional)</label>
        <input id="dumpWeight" type="number" min="0" value="0" />
      </div>
      <div class="field">
        <label for="laborWorkers"
          >Workers<span id="workersInputErrorMsg" class="inputErrorMsg"></span
        ></label>
        <input id="laborWorkers" type="number" min="0" value="0" />
      </div>
      <div class="field">
        <label for="laborHours">Labor Hours ($40/hr)</label>
        <input id="laborHours" type="number" min="0" value="0" step="0.5" />
      </div>
      <div class="field">
        <label for="travelMiles">Travel Distance</label>
        <input id="travelMiles" type="number" min="0" value="0" />
      </div>
      <button id="calcBtn" type="button">Calculate Bid</button>
      <div class="summary hidden">
        <div class="breakdown">
          <p id="minChargeApplied"></p>
          <p>Base Price (volume * material)<span id="baseAmount">$0</span></p>
          <p>Dump fee<span id="dumpAmount">$0</span></p>
          <p>Labor<span id="laborAmount">$0</span></p>
          <p>Travel<span id="travelAmount">$0</span></p>
        </div>
        <p class="result-line">Suggested Bid: <span id="result">$0</span></p>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
