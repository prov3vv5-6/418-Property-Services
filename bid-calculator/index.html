<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bid Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>418 Property Services Bid Calculator</h1>
      <div class="field">
        <label for="equipment">Equipment</label>
        <select id="equipment">
          <option value="17.7">
            Truck + Utility Trailer (17.7 cubic yards)
          </option>
          <option value="15">Utility Trailer (15 cubic yards)</option>
          <option value="2.7">Pickup Truck (2.7 cubic yards)</option>
          <!-- <option value="5">Small Trailer</option> -->

          <!-- <option value="15">Box Truck</option> -->
        </select>
      </div>
      <div class="field">
        <label for="fullness">How Full?</label>
        <select id="fullness">
          <option value="1">Completely Full (1)</option>
          <option value="0.75">Three-Quarters Full (0.75)</option>
          <option value="0.5">Half Full(0.5)</option>
          <option value="0.25">Quarter Full (0.25)</option>
        </select>
      </div>
      <div class="field">
        <!--TODO add numberOfLoadsInputErrorMsg-->
        <label for="numberOfLoads">Number of Loads</label>
        <input id="numberOfLoads" type="number" min="1" value="1" step="1" />
      </div>
      <div class="field">
        <label for="dumpWeight">Heavy Debris (tons)</label>

        <input id="dumpWeight" type="number" min="0" value="0" />
      </div>
      <div class="field">
        <label for="laborWorkers"
          >Workers<span id="workersInputErrorMsg" class="inputErrorMsg"></span
        ></label>
        <input id="laborWorkers" type="number" min="0" value="0" />
      </div>
      <div class="field">
        <label for="laborHours">Labor Hours ($40/hr)</label>
        <input id="laborHours" type="number" min="0" value="0" step="0.5" />
      </div>
      <div class="field">
        <label for="travelMiles"
          >Travel Distance ($1.5/mile after 20 free miles)</label
        >
        <input id="travelMiles" type="number" min="0" value="0" />
      </div>
      <button id="calcBtn" type="button">Calculate Bid</button>
      <p class="result-line">Suggested Bid: <span id="result">$0</span></p>
    </main>
    <script src="script.js"></script>
  </body>
</html>
